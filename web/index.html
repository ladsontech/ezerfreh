<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4CAF50">
  <meta name="description" content="Ezer Fresh - Fresh fruits and vegetables delivered to your doorstep.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ezer Fresh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Warm up connections to external origins used at runtime so the first
       map/font/API request doesn't pay the full DNS+TLS handshake cost. -->
  <link rel="preconnect" href="https://maps.googleapis.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com">

  <title>Ezer Fresh</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDc_fnt5-ONpX32mhCHK0nIGE0aNCADVVI" defer></script>

  <style>
    /* Lightweight branded splash shown while the Flutter engine boots, so
       the page never shows a blank white flash. Pure CSS, no extra
       requests — removed automatically once the first frame is painted. */
    html, body {
      height: 100%;
      margin: 0;
      background: #4CAF50;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #4CAF50;
      transition: opacity 0.25s ease-out;
      z-index: 9999;
    }
    #app-loading.app-loaded {
      opacity: 0;
      pointer-events: none;
    }
    #app-loading img {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      animation: app-loading-pulse 1.4s ease-in-out infinite;
    }
    #app-loading .app-loading-spinner {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      animation: app-loading-spin 0.8s linear infinite;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes app-loading-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.94); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div id="app-loading">
    <img src="icons/Icon-192.png" alt="Ezer Fresh">
    <div class="app-loading-spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter dispatches this event on window right after the first frame
    // is rendered, regardless of renderer — reliable point to hide the
    // splash without guessing at a timeout.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loading');
      if (!loader) return;
      loader.classList.add('app-loaded');
      setTimeout(function () { loader.remove(); }, 300);
    });
  </script>
</body>
</html>
